name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# 호출하는 쪽의 권한이 상한이다. reusable-ci.yml의 ci 잡이 요청하는
# contents, pull-requests, checks, statuses를 모두 줘야 잡이 시작된다.
permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  call-reusable:
    uses: 122yjs/gha-reusable/.github/workflows/reusable-ci.yml@main
    with:
      # code-only Graphify (AST). 문서 Pass 아님.
      run_graphify: true
      # 열린 PR끼리 같은 그래프 커뮤니티를 건드리면 실패 + PR 코멘트
      run_pr_conflicts: true
