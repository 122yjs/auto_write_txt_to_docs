name: Auto PR

# feat/* 브랜치를 푸시하면 PR이 없을 때 자동 생성
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "mb/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          base="main"
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            if ! git show-ref --verify --quiet refs/remotes/origin/main; then
              base="master"
            fi
          fi
          # 열린 PR이 있을 때만 생성을 건너뛴다.
          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$open_pr" ]; then
            echo "PR already exists for $branch"
            exit 0
          fi
          # 본문을 셸 변수로 만든다. `|` 블록 안에서 0열에 두면 YAML이 깨진다.
          printf -v body '## Summary\nAutomated PR for `%s`.\n\n## Test plan\n- [ ] CI green\n- [ ] Smoke-check the changed paths\n' "$branch"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "$branch" \
            --body "$body"
